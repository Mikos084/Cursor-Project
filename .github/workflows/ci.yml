name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Windows build
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          dotnet-quality: ga

      - name: Restore
        run: dotnet restore MultiplePointers.csproj

      - name: Build
        run: dotnet build MultiplePointers.csproj -c Release --no-restore

      - name: Branding regression checks
        run: dotnet run --project tests/BrandingChecks.csproj -c Release

      - name: Publish self-contained x64 smoke build
        run: >-
          dotnet publish MultiplePointers.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:DebugType=None
          -o dist/MultiplePointers

      - name: Upload CI publish output
        uses: actions/upload-artifact@v4
        with:
          name: MultiplePointers-ci-win-x64
          path: dist/MultiplePointers
          if-no-files-found: error
          retention-days: 7
